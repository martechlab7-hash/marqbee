# Local infrastructure. Run `docker compose up -d`, then `PGUSER=postgres PGPASSWORD=postgres PGHOST=localhost pnpm db:setup`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
